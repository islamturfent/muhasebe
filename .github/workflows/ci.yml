# Hesap360 — Continuous Integration
#
# Runs on every push / pull request. Uses PHP 8.2 + MySQL 8 (matching the
# XAMPP/Apache stack) and executes the real application flow:
#   migrate --fresh -> seed -> self-tests
#
# The app is dependency-free (no Composer), so setup is just PHP + PDO.
#
# Optional (off by default): `security` (HTTP CSRF/tenant/RBAC checks) needs a
# running web server, so it runs in a dedicated job with the PHP built-in server.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  tests:
    name: PHP 8.2 + MySQL (migrate/seed/test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: muh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, bcmath, openssl

      - name: Wait for MySQL to be ready (PDO probe)
        env:
          DB_PASSWORD: root
        run: |
          php -r '$dsn="mysql:host=127.0.0.1;port=3306"; $ok=false; for($i=0;$i<30;$i++){ try{ new PDO($dsn,"root",getenv("DB_PASSWORD")); $ok=true; break; }catch(Throwable $e){ sleep(2);} } if(!$ok){ fwrite(STDERR,"MySQL not ready\n"); exit(1);} echo "MySQL ready\n";'

      - name: Create empty test DB (fresh)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh migrate --fresh

      - name: Seed reference + demo data
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh seed

      - name: Run self-tests (AppTester)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
          SESSION_SECURE: 'true'
        run: |
          php bin/muh test

      - name: Readiness gate (bin/muh doctor)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
          SESSION_SECURE: 'true'
        run: |
          php bin/muh doctor

      - name: i18n gate (tr/en translation parity + undefined keys)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          php bin/muh i18n:check

  email-templates:
    name: Gate — e-posta şablonları (email-template)
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: muh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Wait for MySQL to be ready (PDO probe)
        env:
          DB_PASSWORD: root
        run: |
          php -r '$dsn="mysql:host=127.0.0.1;port=3306"; $ok=false; for($i=0;$i<30;$i++){ try{ new PDO($dsn,"root",getenv("DB_PASSWORD")); $ok=true; break; }catch(Throwable $e){ sleep(2);} } if(!$ok){ fwrite(STDERR,"MySQL not ready\n"); exit(1);} echo "MySQL ready\n";'

      - name: Migrate + seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh migrate --fresh
          php bin/muh seed

      - name: Email template gate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          php bin/muh test:email-template
        # Note: php bin/muh test:smtp (loopback SMTP relay) is intentionally NOT
        # run in CI — the loopback subprocess relay is unreliable on hosted
        # runners (PHP exits 255). Run it locally to validate the SMTP path.

  backup-rotation:
    name: Gate — yedek rotasyonu (backup)
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: muh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Wait for MySQL to be ready (PDO probe)
        env:
          DB_PASSWORD: root
        run: |
          php -r '$dsn="mysql:host=127.0.0.1;port=3306"; $ok=false; for($i=0;$i<30;$i++){ try{ new PDO($dsn,"root",getenv("DB_PASSWORD")); $ok=true; break; }catch(Throwable $e){ sleep(2);} } if(!$ok){ fwrite(STDERR,"MySQL not ready\n"); exit(1);} echo "MySQL ready\n";'

      - name: Migrate + seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh migrate --fresh
          php bin/muh seed

      - name: Backup rotation gate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          php bin/muh test:backup

  smoke:
    name: Gate — HTTP route smoke
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: muh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Wait for MySQL to be ready (PDO probe)
        env:
          DB_PASSWORD: root
        run: |
          php -r '$dsn="mysql:host=127.0.0.1;port=3306"; $ok=false; for($i=0;$i<30;$i++){ try{ new PDO($dsn,"root",getenv("DB_PASSWORD")); $ok=true; break; }catch(Throwable $e){ sleep(2);} } if(!$ok){ fwrite(STDERR,"MySQL not ready\n"); exit(1);} echo "MySQL ready\n";'

      - name: Migrate + seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh migrate --fresh
          php bin/muh seed

      - name: HTTP route smoke (server self-started)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          php bin/muh test:smoke

  security:
    name: HTTP security checks (server + bin/muh security)
    runs-on: ubuntu-latest
    needs: tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: muh
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring

      - name: Migrate + seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php bin/muh migrate --fresh
          php bin/muh seed

      - name: Start PHP built-in server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > storage/logs/server-ci.log 2>&1 &
          sleep 2

      - name: Run HTTP security suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: muh
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: http://127.0.0.1:8080
        run: |
          php bin/muh security
