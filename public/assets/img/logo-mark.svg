<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Hesap360">
  <defs>
    <linearGradient id="hg-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#1f3fa8"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#hg-mark)"/>

  <!-- Subtle inner ring for depth -->
  <rect x="6" y="6" width="108" height="108" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Stylized "H" -->
  <g fill="#ffffff">
    <rect x="34" y="30" width="14" height="60" rx="7"/>
    <rect x="72" y="30" width="14" height="60" rx="7"/>
    <rect x="34" y="53" width="52" height="14" rx="7"/>
  </g>

  <!-- 360 / check accent bottom-right -->
  <g transform="translate(82 82)">
    <circle cx="0" cy="0" r="17" fill="#34d399"/>
    <path d="M -6 0 L -1 5 L 7 -5" fill="none" stroke="#062c1d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
