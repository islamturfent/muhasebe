<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Hesap360">
  <defs>
    <linearGradient id="hg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#1f3fa8"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge with soft ring border (for dark & light backgrounds) -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#hg-light)"/>
  <rect x="8" y="8" width="104" height="104" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Stylized "H" -->
  <g fill="#ffffff">
    <rect x="34" y="30" width="14" height="60" rx="7"/>
    <rect x="72" y="30" width="14" height="60" rx="7"/>
    <rect x="34" y="53" width="52" height="14" rx="7"/>
  </g>

  <!-- 360 orbit ring -->
  <circle cx="84" cy="84" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- green check accent -->
  <circle cx="84" cy="84" r="12" fill="#34d399"/>
  <path d="M 79 84 L 83 88 L 90 79" fill="none" stroke="#062c1d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
